<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ステラキャリアズとエージェントのご紹介 | ステラキャリアズ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="apple-touch-icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="../assets/css/slide-viewer.css">
  <link href="https://fonts.googleapis.com/css?display=swap&amp;family=Noto+Sans+JP%3A400,700%7CLato%3A400,700" rel="stylesheet">
</head>

<body>
  <!-- URLを知っている人だけに見せる資料ページ（どこからもリンクしない・検索に出さない）。表示は assets/css/slide-viewer.css と assets/js/slide-viewer.js -->
  <a href=".." class="sv-home" aria-label="ステラキャリアズの公式サイトへ">
    <span class="sv-home-logo">Stellar careers</span>
    <span class="sv-home-label">公式サイトへ</span>
    <span class="sv-home-arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
  </a>
  <main class="sv-stage">
    <h1 class="sv-title">ステラキャリアズとエージェントのご紹介</h1>
    <section class="sv-slide is-current" aria-label="1枚目"><img loading="lazy" decoding="async" src="slides/01.webp" width="1920" height="1080" alt="ステラキャリアズとエージェントのご紹介 1枚目" fetchpriority="high" draggable="false"></section>
    <section class="sv-slide" aria-label="2枚目"><img src="slides/02.webp" width="1920" height="1080" alt="ステラキャリアズとエージェントのご紹介 2枚目" loading="lazy" draggable="false"></section>
    <section class="sv-slide" aria-label="3枚目"><img src="slides/03.webp" width="1920" height="1080" alt="ステラキャリアズとエージェントのご紹介 3枚目" loading="lazy" draggable="false"></section>
    <section class="sv-slide" aria-label="4枚目"><img src="slides/04.webp" width="1920" height="1080" alt="ステラキャリアズとエージェントのご紹介 4枚目" loading="lazy" draggable="false"></section>
  </main>
  <nav class="sv-nav" aria-label="ページ移動">
    <button type="button" class="sv-btn sv-prev" aria-label="前のページ"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg></button>
    <label class="sv-count"><input class="sv-page" type="text" inputmode="numeric" value="1" aria-label="ページ番号（数字を入れて Enter で移動）"><span class="sv-total">/ 4</span></label>
    <button type="button" class="sv-btn sv-next" aria-label="次のページ"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
  </nav>
  <script src="../assets/js/slide-viewer.js"></script>
</body>

</html>
