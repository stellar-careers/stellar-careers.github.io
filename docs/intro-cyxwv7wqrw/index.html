<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ステラキャリアズとエージェントのご紹介 | ステラキャリアズ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="apple-touch-icon" type="image/png" href="../assets/images/favicon.png">
  <link href="https://fonts.googleapis.com/css?display=swap&amp;family=Noto+Sans+JP%3A400,700%7CLato%3A400,700" rel="stylesheet">
  <style>
    /* URLを知っている人だけに見せる資料ページ（どこからもリンクしない・検索に出さない） */
    /* サイトのヘッダー・フッターは置かず、スライドを画面いっぱいに1枚ずつ見せる */
    html { scroll-snap-type: y mandatory; }
    body { margin: 0; background: #e9ebef; font-family: 'Noto Sans JP', sans-serif; }
    .intro-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .intro-slide {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; height: 100dvh; scroll-snap-align: start;
      box-sizing: border-box; padding: 52px 0 8px;  /* 上はHPへ戻るボタンの分をあける */
    }
    /* 16:9 のスライドを、縦横どちらもはみ出さない最大の大きさで表示する */
    .intro-slide img {
      display: block; width: min(100%, calc((100dvh - 60px) * 16 / 9)); height: auto;
      aspect-ratio: 16 / 9; box-shadow: 0 2px 16px rgba(0, 0, 0, 0.12); background: #fff;
    }
    /* HP へ戻るボタン（画面の右上に浮かせる） */
    .intro-home {
      position: fixed; top: 12px; right: 12px; z-index: 10;
      padding: 0.55rem 1rem; border-radius: 999px; background: rgba(17, 24, 39, 0.82); color: #fff;
      font-size: 0.8125rem; font-weight: 700; text-decoration: none; letter-spacing: 0.02em;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); transition: background 0.2s;
    }
    .intro-home:hover { background: rgba(17, 24, 39, 1); }
    @media (max-width: 540px) {
      .intro-home { top: 8px; right: 8px; padding: 0.45rem 0.8rem; font-size: 0.75rem; }
      /* スマホの縦向きは1画面に1枚にすると余白ばかりになるので、続けて並べる */
      html { scroll-snap-type: none; }
      .intro-slide { height: auto; padding: 4px 0; }
      .intro-slide:first-of-type { padding-top: 44px; }
    }
  </style>
</head>

<body>
  <a href=".." class="intro-home">ステラキャリアズ HP へ</a>
  <main>
    <h1 class="intro-title">ステラキャリアズとエージェントのご紹介</h1>
    <section class="intro-slide"><img src="slides/01.webp" width="1920" height="1080" alt="ステラキャリアズとエージェントのご紹介 1枚目" fetchpriority="high"></section>
    <section class="intro-slide"><img src="slides/02.webp" width="1920" height="1080" alt="ステラキャリアズとエージェントのご紹介 2枚目" loading="lazy"></section>
    <section class="intro-slide"><img src="slides/03.webp" width="1920" height="1080" alt="ステラキャリアズとエージェントのご紹介 3枚目" loading="lazy"></section>
    <section class="intro-slide"><img src="slides/04.webp" width="1920" height="1080" alt="ステラキャリアズとエージェントのご紹介 4枚目" loading="lazy"></section>
    <section class="intro-slide"><img src="slides/05.webp" width="1920" height="1080" alt="ステラキャリアズとエージェントのご紹介 5枚目" loading="lazy"></section>
  </main>
</body>

</html>
