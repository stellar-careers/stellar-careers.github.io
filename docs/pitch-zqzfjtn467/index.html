    /* URLを知っている人だけに見せる資料ページ（どこからもリンクしない・検索に出さない） */
    .pitch-main { display: flex; flex-direction: column; align-items: center; width: 100%; padding: 2.5rem 1.25rem 4rem; background: #f3f4f6; }
    .pitch-label { font-family: Lato, sans-serif; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.1em; color: #888; margin-bottom: 0.75rem; }

    /* PDF をブラウザの表示機能でそのまま見せる。画面の高さいっぱいに広げる */
    .pitch-viewer { width: 100%; max-width: 1200px; height: calc(100dvh - 120px); min-height: 480px; border: 0; background: #fff; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08); }
    .pitch-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-top: 2rem; }
    .pitch-btn { display: inline-block; padding: 0.9rem 2.25rem; border-radius: 4px; font-size: 0.9375rem; font-weight: 700; text-decoration: none; transition: opacity 0.2s; }
    .pitch-btn:hover { opacity: 0.8; }
    .pitch-btn-sub { background: #fff; color: #222; border: 1px solid #222; }
    .pitch-btn-main { background: #222; color: #fff; }
    .pitch-note { font-size: 0.8125rem; color: #666; margin-top: 0.75rem; text-align: center; }
    @media (max-width: 540px) {
      .pitch-main { padding: 2rem 0.75rem 3rem; }
      .pitch-title { font-size: 1.25rem; }
      .pitch-viewer { height: 70dvh; }
    }
