    /* URLを知っている人だけに見せる資料ページ（どこからもリンクしない・検索に出さない） */
    .pitch-main { display: flex; flex-direction: column; align-items: center; width: 100%; padding: 3rem 1.25rem 4rem; background: #f3f4f6; }
    .pitch-label { font-family: Lato, sans-serif; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.1em; color: #888; margin-bottom: 0.75rem; }

    .pitch-slides { display: flex; flex-direction: column; gap: 1.25rem; width: 100%; max-width: 1080px; }
    /* 画像の上に透明な板を重ね、右クリック保存・長押し保存・ドラッグをしにくくする */
    .pitch-slide { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #fff; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08); overflow: hidden; }
    .pitch-slide img { display: block; width: 100%; height: 100%; pointer-events: none; }
    .pitch-slide::after { content: ""; position: absolute; inset: 0; }
    .pitch-protect { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .pitch-cta { display: inline-block; margin-top: 3rem; padding: 0.9rem 2.25rem; background: #222; color: #fff; text-decoration: none; border-radius: 4px; font-size: 0.9375rem; font-weight: 700; transition: opacity 0.2s; }
    .pitch-cta:hover { opacity: 0.8; }
    @media (max-width: 540px) {
      .pitch-main { padding: 2rem 0.75rem 3rem; }
      .pitch-title { font-size: 1.25rem; }
      .pitch-slides { gap: 0.75rem; }
    }
    /* 印刷・PDF保存では資料を出さない */
    @media print {
      body * { display: none !important; }
