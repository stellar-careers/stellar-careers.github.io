name: SEO check

# PR と main への push のたびに、ページの SEO 検査とサイトマップの漏れを確かめる（2026-10 SEO施策4）。
# NG が出たら、ローカルで次を実行して直す（手順の詳細は CLAUDE.md の「SEO の仕組み」）:
#   python scripts/seo.py apply           # 構造化データ・メタ情報をそろえる
#   python scripts/gen-sitemap.py         # サイトマップを作り直す
#   python scripts/seo.py check           # 検査（NG 0件になるまで）
# 記事 PR のコメント承認は、この検査が通らないとマージできない。NG のときに直す人は CLAUDE.md の
# 「公開の流れと、SEOチェックがNGのとき」のとおり（2026-10-20 決定）: 記事PR（Copilot 作）は承認者が
# 「@copilot …NG を 0 件にしてください」とコメントして直させ、直らなければ森さんが受けて Claude が直す。
# それ以外のPRは、作った人が直してからマージする。

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/seo.py"
      - "scripts/gen-sitemap.py"
      - ".github/workflows/seo-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/seo.py"
      - "scripts/gen-sitemap.py"

jobs:
  seo-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ページの検査（title・description・h1・canonical・構造化データ・リンク切れ）
        run: python scripts/seo.py check

      - name: サイトマップの検査（載るべきページの不足・余分）
        run: python scripts/gen-sitemap.py --check
